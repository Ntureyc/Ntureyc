<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="130">
  <defs>
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c060e"/>
      <stop offset="50%" stop-color="#180a15"/>
      <stop offset="100%" stop-color="#0c060e"/>
    </linearGradient>
    <linearGradient id="shanksRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#ff3838"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="126" rx="12" fill="url(#quoteBg)" stroke="#ff3838" stroke-width="1.2" stroke-opacity="0.75"/>

  <!-- Left Big Quote Mark -->
  <text x="36" y="62" font-family="Georgia, serif" font-size="54" fill="#ff3838" fill-opacity="0.7">“</text>

  <!-- Quote Text -->
  <text x="75" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-style="italic" font-size="15" fill="#f1f2f6" letter-spacing="0.4">
    You can ridicule me, throw insults at me, or laugh in my face. I'll just shrug it off.
  </text>
  <text x="75" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-style="italic" font-size="15" fill="#ff6b6b" letter-spacing="0.4">
    But... good reason or not... nobody hurts a friend of mine!
  </text>

  <!-- Author Attribution -->
  <text x="75" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="bold" fill="#ffa801" letter-spacing="1.5">
    — "RED-HAIRED" SHANKS // EMPEROR OF THE SEA (四皇)
  </text>

  <!-- Right Crossed Sabers Accent -->
  <g transform="translate(840, 65)">
    <circle cx="0" cy="0" r="22" fill="#140810" stroke="#ff3838" stroke-width="1.2"/>
    <g transform="translate(-10, -10) scale(0.85)">
      <path fill="none" stroke="#ff3838" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m13 19l6-6m-4.5 4.5L3.586 6.586A2 2 0 0 1 3 5.172V3h2.172a2 2 0 0 1 1.414.586L17.5 14.5m-2.672-8.328l2.586-2.586A2 2 0 0 1 18.828 3H21v2.172a2 2 0 0 1-.586 1.414l-2.586 2.586M16 16l4 4m-1 1l2-2M5 14l4 4m-4 3l-2-2m4.5-2.5L4 20"/>
    </g>
  </g>
</svg>
